name: Publish community plugin

on:
  issues:
    types: [opened, edited]

concurrency:
  group: community-plugin-catalog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: startsWith(github.event.issue.title, '[Plugin Submission]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2

      - name: Validate submission
        id: submission
        run: bun scripts/submit-community-plugin.ts

      - name: Merge community catalogue
        run: bun scripts/merge-community-catalog.ts

      - name: Commit catalogue update
        env:
          PLUGIN_ID: ${{ steps.submission.outputs.plugin_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/community.json plugins/catalog.json
          if git diff --cached --quiet; then
            echo "Catalogue already contains this plugin version."
          else
            git commit -m "📦 Publish community plugin ${PLUGIN_ID}"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Update marketplace release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ steps.submission.outputs.package_path }}
        run: gh release upload plugins "$PACKAGE_PATH" plugins/catalog.json --clobber

      - name: Confirm publication
        if: success()
        uses: actions/github-script@v7
        env:
          PLUGIN_ID: ${{ steps.submission.outputs.plugin_id }}
          PLUGIN_NAME: ${{ steps.submission.outputs.plugin_name }}
          PLUGIN_VERSION: ${{ steps.submission.outputs.plugin_version }}
        with:
          script: |
            const body = `自动发布完成：**${process.env.PLUGIN_NAME}**（\`${process.env.PLUGIN_ID}@${process.env.PLUGIN_VERSION}\`）现已加入灵动岛插件市场。`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: "closed" });

      - name: Explain failed submission
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = "自动发布没有完成。请查看此 Issue 的 Actions 运行记录，按校验错误修正包或表单后编辑此 Issue 重试。";
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
